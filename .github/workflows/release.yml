name: Release & Publish (NPM + GitHub Packages)

on:
    push:
        tags:
            - "v*"

# Required permissions for creating GitHub Releases and publishing to GitHub Packages
permissions:
    contents: write
    packages: write

jobs:
    build-and-test:
        name: Test & Build
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Code
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: "npm"

            - name: Install Dependencies
              run: npm ci

            - name: Run Test Coverage
              run: npm run test:coverage

            - name: Build Distribution Bundle
              run: npm run build

            # Cache the compiled dist directory for downstream publishing jobs
            - name: Upload Build Artifacts
              uses: actions/upload-artifact@v4
              with:
                  name: dist-artifacts
                  path: dist/
                  retention-days: 1

    publish-npm:
        name: Publish to NPM
        needs: build-and-test
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Code
              uses: actions/checkout@v4

            - name: Setup Node.js (NPM Registry)
              uses: actions/setup-node@v4
              with:
                  node-version: 20
                  registry-url: "https://registry.npmjs.org"

            - name: Download Build Artifacts
              uses: actions/download-artifact@v4
              with:
                  name: dist-artifacts
                  path: dist

            - name: Publish to NPM Registry
              run: npm publish --access public --ignore-scripts
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

    publish-github:
        name: Publish to GitHub Packages
        needs: build-and-test
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Code
              uses: actions/checkout@v4

            - name: Setup Node.js (GitHub Registry)
              uses: actions/setup-node@v4
              with:
                  node-version: 20
                  registry-url: "https://npm.pkg.github.com"
                  scope: "@omar-afifi-salama"

            - name: Download Build Artifacts
              uses: actions/download-artifact@v4
              with:
                  name: dist-artifacts
                  path: dist

            - name: Publish to GitHub Packages
              run: npm publish --ignore-scripts
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    create-github-release:
        name: Create GitHub Release
        needs: [publish-npm, publish-github]
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Code
              uses: actions/checkout@v4

            - name: Create Release
              uses: softprops/action-gh-release@v2
              with:
                  generate_release_notes: true
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
